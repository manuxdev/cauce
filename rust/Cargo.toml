[workspace]
resolver = "3"
members = ["cauce_bridge", "cauce_core"]
# The vendored Sonora keeps its own workspace.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

# Patches for the vendored crates' dependencies: a nested workspace's patches do not apply here.
[patch.crates-io]
rodio = { git = "https://github.com/RustAudio/rodio", rev = "880aaba54b00aead53651ed1ccbdb672d1375a95" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
